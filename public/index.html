<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickWerx - Transcriptor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="w-full bg-slate-950 border-b border-slate-800 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-black text-xl">QW</div>
            <span class="text-2xl font-bold tracking-tight text-white">Quick<span class="text-indigo-400">Werx</span></span>
        </div>
        <div class="flex items-center gap-4">
            <label for="audioInput" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-semibold border border-slate-700 transition flex items-center gap-2">
                <i data-lucide="upload"></i> Cargar Archivo
            </label>
            <input type="file" id="audioInput" accept="audio/*,video/*" class="hidden">
            <button id="downloadBtn" disabled class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white px-6 py-2 rounded-lg font-bold uppercase text-sm transition flex items-center gap-2">
                <i data-lucide="download"></i> Descargar Transcripción
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6">
        <section class="lg:col-span-6 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 flex flex-col justify-center items-center">
            <div id="noMediaPlaceholder" class="text-center text-slate-500">
                <i data-lucide="file-audio" class="w-16 h-16 mx-auto mb-3 opacity-40"></i>
                <p class="text-lg">Sube un archivo para comenzar</p>
            </div>
            <audio id="audioPlayer" controls class="w-full hidden bg-slate-800 rounded-lg p-2"></audio>
        </section>

        <section class="lg:col-span-6 bg-slate-950/60 border border-slate-800 rounded-2xl p-6 flex flex-col">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Transcripción</h2>
            <textarea id="transcriptionOutput" readonly class="w-full flex-1 bg-transparent text-slate-300 text-base border-0 focus:outline-none resize-none" placeholder="El resultado aparecerá aquí..."></textarea>
        </section>
    </main>

    <div id="loadingModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center hidden">
        <div class="bg-white text-slate-900 rounded-3xl p-8 max-w-md w-full text-center">
            <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
            <h3 class="text-2xl font-extrabold mb-2">Estamos transcribiendo tu archivo...</h3>
            <p class="text-slate-500 text-sm">Por favor, espera unos segundos.</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const audioInput = document.getElementById('audioInput');
        const audioPlayer = document.getElementById('audioPlayer');
        const noMediaPlaceholder = document.getElementById('noMediaPlaceholder');
        const transcriptionOutput = document.getElementById('transcriptionOutput');
        const loadingModal = document.getElementById('loadingModal');
        const downloadBtn = document.getElementById('downloadBtn');

        audioInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            audioPlayer.src = URL.createObjectURL(file);
            audioPlayer.classList.remove('hidden');
            noMediaPlaceholder.classList.add('hidden');

            const formData = new FormData();
            formData.append('audio', file);
            loadingModal.classList.remove('hidden');

            try {
                const response = await fetch('/api/transcribe', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.error) alert(data.error);
                else {
                    transcriptionOutput.value = data.text;
                    downloadBtn.disabled = false;
                }
            } catch (err) {
                alert('Error al procesar el audio.');
            } finally {
                loadingModal.classList.add('hidden');
            }
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([transcriptionOutput.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'transcripcion.txt';
            a.click();
        });
    </script>
</body>
</html>
